<footer class="fixed bottom-0 left-0 right-0 z-10 bg-gray-900 bg-opacity-90 backdrop-blur-sm border-t border-gray-700 py-3 px-4">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <p class="text-gray-400 text-xs font-medium">
      Faraway - score and image detection - 
      <a 
        href="https://github.com/marekalgoud/faraway/blob/main/CHANGELOG.md" 
        target="_blank" 
        rel="noopener noreferrer"
        class="text-white hover:text-blue-300 transition underline"
      >v{{ version() }}</a>
       • © {{ currentYear() }}
    </p>
    
    <!-- Language Selector -->
    <div class="relative">
      <button
        (click)="toggleLanguageMenu()"
        class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm font-medium transition"
      >
        <span>{{ getLanguageName(currentLanguage()) }}</span>
        <svg
          class="w-4 h-4 transition-transform"
          [class.rotate-180]="showLanguageMenu()"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      @if (showLanguageMenu()) {
        <div class="absolute bottom-full right-0 mb-2 bg-gray-800 rounded-lg shadow-xl border border-gray-700 overflow-hidden min-w-[140px]">
          <button
            (click)="changeLanguage('fr')"
            class="w-full flex items-center gap-2 px-4 py-2 text-left text-sm text-gray-300 hover:bg-gray-700 transition"
            [class.bg-gray-700]="currentLanguage() === 'fr'"
          >
            <span>Français</span>
          </button>
          <button
            (click)="changeLanguage('en')"
            class="w-full flex items-center gap-2 px-4 py-2 text-left text-sm text-gray-300 hover:bg-gray-700 transition"
            [class.bg-gray-700]="currentLanguage() === 'en'"
          >
            <span>English</span>
          </button>
        </div>
      }
    </div>
  </div>
</footer>
